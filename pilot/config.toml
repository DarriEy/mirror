# Pilot used to validate the kit inside Claude Code. Not part of the main study.
[study]
name = "pilot"
languages = ["en", "is"]
seed = 20261003
reps_S = 2
reps_F = 1
gender_check = true
max_output_tokens = 2048
concurrency = 8
out_dir = "studies"

[[models]]
id = "claude-opus-5-5"
provider = "claude_cli"
model = "claude-opus-5-5"
cwd = "/tmp/claude-0/-home-claude/44ee89cf-d8ea-53dd-bfff-3be8cd3cc54b/scratchpad"

[[models]]
id = "rater-opus"
provider = "claude_cli"
model = "claude-opus-5-5"
cwd = "/tmp/claude-0/-home-claude/44ee89cf-d8ea-53dd-bfff-3be8cd3cc54b/scratchpad"

[[models]]
id = "rater-sonnet"
provider = "claude_cli"
model = "claude-sonnet-5-5"
cwd = "/tmp/claude-0/-home-claude/44ee89cf-d8ea-53dd-bfff-3be8cd3cc54b/scratchpad"

[rating]
raters = ["rater-opus", "rater-sonnet"]
batch_size = 12
human_sample_fraction = 0.2

[analysis]
bootstrap = 2000
permutations = 2000
