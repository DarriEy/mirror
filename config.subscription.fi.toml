[study]
name = "subscription-codex-fi-20261004"
exploratory = true
method_note = "Separate Finnish exploratory extension via Codex subscription requesting gpt-6-astra. Same scenarios and repetitions as earlier languages. Translation has no independent native-speaker validation. One blind self-rater; no independent or human validation. Pre-run prediction: same sign, possibly different magnitude; assess equivalence within +/-0.10 rather than inferring absence from nonsignificance. See METHODS.md."
languages = ["fi"]
seed = 20261003
reps_S = 10
reps_F = 4
gender_check = true
max_output_tokens = 2048
concurrency = 4

[[models]]
id = "codex-subscription"
provider = "codex_cli"
model = "gpt-6-astra"
keep_raw = true

[rating]
raters = ["codex-subscription"]
batch_size = 12
human_sample_fraction = 0.2

[analysis]
equivalence_raise = 0.10
equivalence_likelihood = 10.0
equivalence_net_legitimacy = 0.5
bootstrap = 5000
permutations = 10000
