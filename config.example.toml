# Copy to config.toml and fill in model ids and API key variable names.
# Run `python -m mirror build` once, publish the printed fingerprint (e.g. on OSF), then run.

[study]
name = "mirror-v2"
languages = ["en", "is"]     # scenario files in scenarios/
seed = 20261003
reps_S = 10                  # structured-decision replies per cell per scenario
reps_F = 4                   # free-text replies per cell per scenario
gender_check = true          # one gender-inference check per message
max_output_tokens = 2048     # reasoning models need room; raise if replies are cut off
concurrency = 4

# One block per model. `id` is your short label; `model` is the provider's API model id.
# Check each provider's current model list; ids change often.
[[models]]
id = "chatgpt"
provider = "openai"
model = "REPLACE_WITH_OPENAI_MODEL_ID"
key_env = "OPENAI_API_KEY"

[[models]]
id = "gemini"
provider = "gemini"
model = "REPLACE_WITH_GEMINI_MODEL_ID"
key_env = "GEMINI_API_KEY"

[[models]]
id = "claude"
provider = "anthropic"
model = "claude-opus-5-5"
key_env = "ANTHROPIC_API_KEY"

[rating]
# Each rater rates every free-text reply, blind and shuffled. Using one rater
# per vendor lets you check whether a rater favours its own vendor.
raters = ["chatgpt", "gemini", "claude"]
batch_size = 12
human_sample_fraction = 0.2

[analysis]
equivalence_raise = 0.10         # smallest effect of interest, recommendation score (0-1)
equivalence_likelihood = 10.0    # smallest effect of interest, stated likelihood (0-100)
equivalence_net_legitimacy = 0.5 # smallest effect of interest, rated net legitimacy (-4..4)
bootstrap = 5000
permutations = 10000
